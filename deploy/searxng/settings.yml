# Minimal private SearXNG configuration for CKQClaw.
# Two requirements matter:
#   1. search.formats must include json — mcp-searxng queries the JSON API.
#   2. The instance is loopback-only (see compose.yaml); the limiter and
#      public-instance bits stay off because there is no public exposure.
# The engine whitelist keeps the default query path usable on this network:
# the upstream defaults (brave/duckduckgo/google/wikipedia) all time out
# here, and mcp-searxng only appends an explicit `engines=` param when the
# caller asks — default queries hit the instance default set. Availability
# drifts (TASK-D §3: bing/mojeek passed a probe, then didn't) — re-probe
# with `curl ".../search?q=test&format=json&engines=<name>"` before
# swapping entries.
use_default_settings:
  engines:
    keep_only:
      - 360search
      - sogou
      - yandex
      - github
      - mwmbl

server:
  secret_key: 'ckqclaw-private-instance-change-me'
  limiter: false
  image_proxy: false
  port: 8080
  bind_address: '0.0.0.0'

search:
  safe_search: 0
  autocomplete: ''
  formats:
    - html
    - json

# keep_only only filters the default table; 360search/sogou/yandex/mwmbl
# still carry `disabled: true` upstream and the default search path skips
# disabled engines — flip them explicitly (github ships enabled; the
# explicit override keeps the intent visible for every whitelisted name).
engines:
  - name: 360search
    disabled: false
  - name: sogou
    disabled: false
  - name: yandex
    disabled: false
  - name: github
    disabled: false
  - name: mwmbl
    disabled: false
