# Self-hosted SearXNG for CKQClaw web search (no API key required).
# Binds to loopback only — do NOT publish this instance to the public
# internet: it is a private meta-search backend for the mcp-searxng bridge.
# Required settings live in ./settings.yml (json output format enabled);
# without `formats: [html, json]` the MCP server gets empty results.

services:
  searxng:
    image: searxng/searxng:latest
    container_name: ckqclaw-searxng
    restart: unless-stopped
    ports:
      # Loopback only. Change the host port here and SEARXNG_URL in the
      # mcp-searxng MCP config together if 8080 is taken.
      - '127.0.0.1:8080:8080'
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    cap_drop:
      - ALL
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8080/
